name: Compilar y Publicar APK Pulso M34

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar app-debug.apk y publicar Release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK de prueba (Debug)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
          cp app/build/outputs/apk/debug/app-debug.apk Pulso-M34-ANTHI.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Pulso-M34-ANTHI-APK
          path: Pulso-M34-ANTHI.apk
          if-no-files-found: error

      - name: Publicar APK directa en Release (latest-apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Pulso M34 · APK Android
          body: Compilación automática de Pulso M34 (ecosistema ANTHI).
          files: Pulso-M34-ANTHI.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
